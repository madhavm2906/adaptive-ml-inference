# Verify the Python service and preserve automated test evidence.
# Use CPU-only PyTorch and the dependency versions tested locally.

name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tested.txt

      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Record installed environment
        run: |
          mkdir -p results/ci
          python --version > results/ci/python-version.txt
          python -m pip freeze --exclude-editable > results/ci/installed-packages.txt

      - name: Run all tests
        run: python -m pytest -v --junitxml=results/ci/junit.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python312-cpu-test-evidence
          path: results/ci/
          if-no-files-found: warn
          retention-days: 14